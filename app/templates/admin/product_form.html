{% extends 'admin/layout.html' %}{% from 'macros.html' import csrf %}{% block admin_content %}<div class="admin-title"><div><span>CATÁLOGO</span><h1>Novo produto</h1></div></div><section class="admin-panel"><form method="post" class="admin-form">{{ csrf() }}<div class="form-row"><label>Nome<input name="name" required></label><label>Slug<input name="slug" placeholder="camiseta-nova" required></label></div><label>Descrição<textarea name="description" rows="5" required></textarea></label><div class="form-row"><label>Preço<input type="number" name="price" step="0.01" min="0" required></label><label>Categoria<select name="category_id">{% for category in categories %}<option value="{{ category.id }}">{{ category.name }}</option>{% endfor %}</select></label></div><label class="check"><input type="checkbox" name="featured"> Produto em destaque</label><button class="btn">Salvar produto</button></form></section>{% endblock %}
